<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Jailbreak - WebKit Only</title>
<style>
:root {
    --bg: #0d0d10;
    --bg-card: #16161a;
    --border: #2a2a32;
    --text: #e8e8ec;
    --text-muted: #8a8a95;
    --accent: #00d4aa;
    --danger: #ff4757;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.container { width: 100%; max-width: 520px; text-align: center; }
.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 16px;
}
.icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 24px;
    color: #fff;
}
h1 { font-size: 1.125rem; font-weight: 700; margin-bottom: 8px; }
p { color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; }
.console {
    background: #0a0a0c;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    line-height: 1.6;
    max-height: 200px;
    overflow-y: auto;
    color: var(--text-muted);
    margin-top: 16px;
    text-align: left;
}
.back {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 600;
}
.back:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="icon">!</div>
        <h1>WebKit Exploit Only</h1>
        <p>This firmware is not supported for a full kernel jailbreak.<br>
        The WebKit exploit will run but cannot escalate to kernel privileges.</p>
    </div>
    <div class="console" id="console"></div>
    <a href="index.html" class="back">Back to Home</a>
</div>

<script type="module">
import { startAttempt } from "./src/lapse-runtime.js";

const consoleEl = document.getElementById("console");
function log(msg) {
    const line = document.createElement("div");
    line.textContent = msg;
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

const params = new URLSearchParams(location.search);
const fw = params.get("fw") || "unknown";
log(`Firmware: ${fw}`);
log("WebKit exploit running...");

(async () => {
    try {
        await startAttempt(params);
        log("WebKit exploit complete. Userland achieved.");
        log("Kernel exploit not available for this firmware.");
    } catch (e) {
        log(`Error: ${e.message || e}`);
    }
})();
</script>

</body>
</html>
