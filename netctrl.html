<!DOCTYPE html>
<html lang="en" data-ver="2026-08-10-v8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 JB v8</title>
<style>
:root { --bg: #0d0d10; --bg-card: #16161a; --border: #2a2a32; --text: #e8e8ec; --text-muted: #8a8a95; --accent: #00d4aa; --danger: #ff4757; --warning: #ffa502; --success: #2ed573; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
.container { width: 100%; max-width: 640px; }
.header { text-align: center; margin-bottom: 32px; }
.header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
.header p { color: var(--text-muted); font-size: .875rem; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
.progress-bar .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #00b894); border-radius: 2px; transition: width .5s ease; }
.console { background: #0a0a0c; border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-family: var(--font-mono); font-size: .75rem; line-height: 1.6; max-height: 400px; overflow-y: auto; color: var(--text-muted); }
.console .line { margin-bottom: 2px; }
.console .line.ok { color: var(--success); }
.console .line.err { color: var(--danger); }
.console .line.warn { color: var(--warning); }
.console .line.info { color: #3498db; }
.console .line.stage { color: var(--accent); font-weight: 600; }
.status-badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: var(--border); color: var(--text-muted); }
.status-badge.running { background: var(--accent); color: #000; }
.status-badge.success { background: var(--success); color: #000; }
.status-badge.error { background: var(--danger); color: #fff; }
.footer { text-align: center; margin-top: 24px; font-size: .75rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>PS5 Jailbreak</h1>
    <p id="fw-display">Initializing...</p>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span style="font-size:.875rem;font-weight:600;">Exploit Progress</span>
      <span class="status-badge" id="status-badge">Running</span>
    </div>
    <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
  </div>
  <div class="console" id="console"></div>
  <div class="footer">
    <p>Do not close this window. A failed race may require a console reboot.</p>
  </div>
</div>

<script>
(function() {
  var ts = Date.now();
  var s = document.createElement("script");
  s.src = "./src/netctrl-ps5.js?ts=" + ts;
  s.onload = function() { window.__nc_js_loaded = true; };
  s.onerror = function() { window.__nc_js_error = true; };
  document.head.appendChild(s);
})();
</script>

<script>
try {
  var consoleEl = document.getElementById("console");
  var progressFill = document.getElementById("progress-fill");
  var statusBadge = document.getElementById("status-badge");
  var fwDisplay = document.getElementById("fw-display");
  var params = new URLSearchParams(location.search);

  function log(msg, type) {
    var line = document.createElement("div");
    line.className = "line " + (type || "");
    line.textContent = msg;
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  window.addEventListener("error", function(e) {
    log("Error: " + e.message, "err");
    statusBadge.textContent = "Error";
    statusBadge.className = "status-badge error";
  });

  window.addEventListener("unhandledrejection", function(e) {
    log("Unhandled: " + e.reason, "err");
  });

  var progress = 0;
  function updateProgress(pct, stage) {
    progress = pct;
    progressFill.style.width = pct + "%";
    if (stage) log(stage, "stage");
  }

  var fw = params.get("fw") || "";
  if (!fw) {
    var m = navigator.userAgent.match(/PlayStation 5\s+([0-9]+\.[0-9]+)/);
    if (m) {
      fw = m[1];
      log("FW auto-detected from UA: " + fw, "stage");
    }
  }
  if (!fw) {
    fw = "unknown";
    log("FW not detected - using 'unknown'", "warn");
  }

  fwDisplay.textContent = "Firmware " + fw + " - NetControl (Poopsploit) Chain v8";

  window.slopkit = window.slopkit || {};
  if (fw !== "unknown" && !window.slopkit.FW_VERSION) {
    window.slopkit.FW_VERSION = fw;
    log("FW_VERSION synced: " + fw, "stage");
  }
  window.slopkit.screenLine = function(m) { log(m, "info"); };
  window.__slopkit_log = log;
  window.__slopkit_progress = updateProgress;
  window.__elfldr_diag = [];

  log("HTML loaded v8 ts=" + Date.now(), "stage");

  function waitForScript() {
    return new Promise(function(res, rej) {
      if (window.__nc_js_error) return rej("script load error");
      if (window.netctrl_ps5 && window.netctrl_ps5.run) return res();
      var n = 0;
      var iv = setInterval(function() {
        if (window.__nc_js_error) { clearInterval(iv); rej("script load error"); }
        if (window.netctrl_ps5 && window.netctrl_ps5.run) { clearInterval(iv); res(); }
        if (++n > 300) { clearInterval(iv); rej("timeout waiting for netctrl-ps5.js"); }
      }, 100);
    });
  }

  log("Waiting for netctrl-ps5.js...", "stage");

  waitForScript().then(function() {
    log("netctrl-ps5.js loaded, starting...", "stage");
    updateProgress(5, "Loading runtime");
    return window.netctrl_ps5.run(params);
  }).then(function(ok) {
    var diag = window.__elfldr_diag || [];
    if (diag.length > 0) {
      log("--- elfldr diagnostics ---", "stage");
      for (var i = 0; i < diag.length; i++) log(diag[i], "info");
    }
    if (ok) {
      updateProgress(100, "Complete");
      statusBadge.textContent = "Success";
      statusBadge.className = "status-badge success";
      log("Jailbreak complete. ELF loader should be active on port 9021.", "ok");
    } else {
      updateProgress(75);
      statusBadge.textContent = "Partial";
      statusBadge.className = "status-badge error";
      log("Jailbreak verified (uid=0, kernel R/W live) but ELF loader did not start.", "warn");
      log("This usually means the exploit chain won the race but elfldr failed to load.", "warn");
      log("Reboot the console and retry - the kernel bug is confirmed reachable.", "info");
    }
  }).catch(function(e) {
    var diag = window.__elfldr_diag || [];
    if (diag.length > 0) {
      log("--- elfldr diagnostics ---", "stage");
      for (var i = 0; i < diag.length; i++) log(diag[i], "info");
    }
    updateProgress(0);
    statusBadge.textContent = "Failed";
    statusBadge.className = "status-badge error";
    log("Exploit failed: " + (e.message || e), "err");
    log("If this was a lost race, reboot the console before retrying.", "warn");
  });
} catch (e) {
  document.getElementById("console").innerHTML += '<div class="line err">FATAL: ' + (e.message || e) + '</div>';
}
</script>
</body>
</html>
