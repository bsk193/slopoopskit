<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Jailbreak - Running</title>
<style>
:root {
    --bg: #0d0d10;
    --bg-card: #16161a;
    --border: #2a2a32;
    --text: #e8e8ec;
    --text-muted: #8a8a95;
    --accent: #00d4aa;
    --danger: #ff4757;
    --warning: #ffa502;
    --success: #2ed573;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
}
.container { width: 100%; max-width: 640px; }
.header {
    text-align: center;
    margin-bottom: 32px;
}
.header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
.header p { color: var(--text-muted); font-size: 0.875rem; }

.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
}

.progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 16px;
}
.progress-bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #00b894);
    border-radius: 2px;
    transition: width 0.5s ease;
}

.console {
    background: #0a0a0c;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    line-height: 1.6;
    max-height: 400px;
    overflow-y: auto;
    color: var(--text-muted);
}
.console .line { margin-bottom: 2px; }
.console .line.ok { color: var(--success); }
.console .line.err { color: var(--danger); }
.console .line.warn { color: var(--warning); }
.console .line.info { color: #3498db; }
.console .line.stage { color: var(--accent); font-weight: 600; }

.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--border);
    color: var(--text-muted);
}
.status-badge.running { background: var(--accent); color: #000; }
.status-badge.success { background: var(--success); color: #000; }
.status-badge.error { background: var(--danger); color: #fff; }

.footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.75rem;
    color: var(--text-muted);
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PS5 Jailbreak</h1>
        <p id="fw-display">Initializing...</p>
    </div>

    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <span style="font-size:0.875rem;font-weight:600;">Exploit Progress</span>
            <span class="status-badge" id="status-badge">Running</span>
        </div>
        <div class="progress-bar">
            <div class="fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="console" id="console"></div>

    <div class="footer">
        <p>Do not close this window. A failed race may require a console reboot.</p>
    </div>
</div>

<script src="./src/netctrl-ps5.js"></script>
<script>
const consoleEl = document.getElementById("console");
const progressFill = document.getElementById("progress-fill");
const statusBadge = document.getElementById("status-badge");
const fwDisplay = document.getElementById("fw-display");

const params = new URLSearchParams(location.search);
const fw = params.get("fw") || "unknown";
fwDisplay.textContent = `Firmware ${fw} - NetControl (Poopsploit) Chain`;

function log(msg, type) {
    const line = document.createElement("div");
    line.className = "line " + (type || "");
    line.textContent = msg;
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

window.addEventListener("error", e => {
    log(`Error: ${e.message}`, "err");
    statusBadge.textContent = "Error";
    statusBadge.className = "status-badge error";
});

window.addEventListener("unhandledrejection", e => {
    log(`Unhandled: ${e.reason}`, "err");
});

// Progress tracking
let progress = 0;
const updateProgress = (pct, stage) => {
    progress = pct;
    progressFill.style.width = pct + "%";
    if (stage) log(stage, "stage");
};

// Hook into the exploit's beacon/logging if available
window.__slopkit_log = log;
window.__slopkit_progress = updateProgress;

// Start the exploit chain
(async () => {
    try {
        log("Initializing exploit runtime...", "stage");
        updateProgress(5, "Loading runtime");
        
        await window.netctrl_ps5.run(params);
        
        updateProgress(100, "Complete");
        statusBadge.textContent = "Success";
        statusBadge.className = "status-badge success";
        log("Jailbreak complete. ELF loader should be active on port 9021.", "ok");
    } catch (e) {
        updateProgress(0);
        statusBadge.textContent = "Failed";
        statusBadge.className = "status-badge error";
        log(`Exploit failed: ${e.message || e}`, "err");
        log("If this was a lost race, reboot the console before retrying.", "warn");
    }
})();
</script>

</body>
</html>
